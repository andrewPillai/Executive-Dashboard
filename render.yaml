services:
  - type: web
    name: northstar-executive-dashboard
    runtime: python
    plan: free
    rootDir: application
    buildCommand: pip install -r python-requirements.lock
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
